<!DOCTYPE html>

<head>

<style>

  background:var(--tan);

.creator-text h2{margin-top:0}
.creator-intro{font-size:1.08rem;color:#454d5d;max-width:650px}

/* Community */
.community-shell{
  display:grid;
  grid-template-columns:1.35fr .85fr;
  gap:20px;
  margin-top:30px;
}

.community-feed{
  min-height:330px;
  max-height:520px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.chat-message{
  padding:14px 16px;
  border-radius:18px;
  background:rgba(247,244,213,.82);
  border-left:5px solid var(--moss);
}

  background:rgba(211,150,140,.13);

}

  color:var(--midnight);
  text-decoration:none;
}

.community-form{
  display:grid;
  gap:10px;
}

.community-form .row{

  grid-template-columns:1fr 1fr;
  gap:10px;
}

.language-shelf-head .language-filter{max-width:230px}
